[package]
name = "funliday-cli"
version = "0.1.0"
edition = "2024"
description = "Unofficial command-line client and MCP server for Funliday"
license = "MIT"

[[bin]]
name = "funliday"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "io-std", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
urlencoding = "2"

[dev-dependencies]
httpmock = "0.8"
